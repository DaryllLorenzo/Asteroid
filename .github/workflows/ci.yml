name: Code Quality

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      # 1. Lint (errores de código)
      - name: Ruff check
        run: ruff check .

      # 2. Format check (sin modificar archivos)
      - name: Ruff format check
        run: ruff format . --check

      # 3. Type checking
      - name: MyPy check
        run: mypy .