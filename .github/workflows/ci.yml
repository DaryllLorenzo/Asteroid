name: Code Quality

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      # 1. Lint (errores de código)
      - name: Ruff check
        run: ruff check .

      # 2. Format check (sin modificar archivos)
      - name: Ruff format check
        run: ruff format . --check

      # 3. Type checking
      - name: MyPy check
        run: mypy .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      # Qt must never try to reach a real display on a CI runner.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest -q

      - name: Coverage report
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -q --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error